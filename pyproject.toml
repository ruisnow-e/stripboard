[project]
name = "stripboard"
version = "1.0.0"
description = "A dual-layer film production optimization framework: terrain-weighted shortest paths, then exact shooting-order scheduling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib", "numpy"]
dev = ["pytest"]

[project.scripts]
stripboard = "stripboard.pipeline:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stripboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
